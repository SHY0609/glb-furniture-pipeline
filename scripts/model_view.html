<!DOCTYPE html>
<!-- 单模型多角度朝向验证页：?model=家具_med.glb&yaw=0&pitch=20
     配合 cdp_shot.mjs 使用（等 title 出现 READY）。
     约定：模型放在服务器根目录；three 库默认走 jsdelivr，国内慢请自托管（见下方 importmap 注释）。 -->
<html><head><meta charset="utf-8"><title>model view</title>
<style>body{margin:0;background:#1a1a2e}canvas{display:block}</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<!-- 自托管（推荐，国内 CDN 8-10s/文件）：
     把 three 包的 build/three.module.js、examples/jsm/（含 loaders/utils/libs/draco）拷到站点目录，
     上面 importmap 改成 "three":"/_three_lib/three.module.js"、"three/addons/":"/_three_lib/"，
     下面 DRACOLoader 的 setDecoderPath 同步改 "/_three_lib/draco/"。 -->
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const QS = new URLSearchParams(location.search);
const yawDeg = parseFloat(QS.get('yaw') || '0');   // 相机绕 Y 旋转角
const pitchDeg = parseFloat(QS.get('pitch') || '20'); // 相机俯角

const cvs = document.createElement('canvas');
document.body.appendChild(cvs);
const renderer = new THREE.WebGLRenderer({ canvas: cvs, antialias: true });
renderer.setSize(900, 700);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb4d4);
const cam = new THREE.PerspectiveCamera(50, 900 / 700, 0.05, 100);

// 地板 + 网格
scene.add(new THREE.GridHelper(6, 24, 0x3366aa, 0x224466));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 灯光
scene.add(new THREE.HemisphereLight(0xffffff, 0x556677, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(3, 5, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// 坐标轴：红X 绿Y 蓝Z + 三色小球标记（红=+X，蓝=+Z，黄=-Z）
scene.add(new THREE.AxesHelper(1.5));
const mk = (color, p) => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({ color })); m.position.copy(p); scene.add(m); };
mk(0xff0000, new THREE.Vector3(1.5, 0.05, 0));
mk(0x0000ff, new THREE.Vector3(0, 0.05, 1.5));
mk(0xffff00, new THREE.Vector3(0, 0.05, -1.5));

const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
loader.setDRACOLoader(draco);

const modelName = QS.get('model') || 'model_med.glb';
loader.load('/' + modelName.replace(/^\/+/, ''), (gltf) => {
  const obj = gltf.scene;
  obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(obj);

  // 底面贴地
  const bb = new THREE.Box3().setFromObject(obj);
  obj.position.y -= bb.min.y;
  obj.updateMatrixWorld(true);

  // 半透明 bbox 线框 + 尺寸写进 title
  const bb2 = new THREE.Box3().setFromObject(obj);
  const size = bb2.getSize(new THREE.Vector3());
  const box = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(size.x, size.y, size.z)),
    new THREE.LineBasicMaterial({ color: 0x00ff88 })
  );
  box.position.copy(bb2.getCenter(new THREE.Vector3()));
  scene.add(box);

  // 相机绕中心
  const center = new THREE.Vector3(0, size.y * 0.4, 0);
  const dist = Math.max(size.x, size.y, size.z) * 2.2 + 0.8;
  const rad = THREE.MathUtils.degToRad(yawDeg);
  const camY = Math.sin(THREE.MathUtils.degToRad(pitchDeg)) * dist;
  const camR = Math.cos(THREE.MathUtils.degToRad(pitchDeg)) * dist;
  cam.position.set(center.x + Math.sin(rad) * camR, center.y + camY, center.z + Math.cos(rad) * camR);
  cam.lookAt(center);
  renderer.render(scene, cam);
  setTimeout(() => {
    document.title = `${modelName} ${size.x.toFixed(2)}x${size.y.toFixed(2)}x${size.z.toFixed(2)} | yaw=${yawDeg} | READY`;
  }, 200);
}, undefined, (err) => { document.title = 'LOAD_FAIL'; console.error(err); });
</script>
</body></html>
